# Cadence intent taxonomy for @SpotifyCares — v1 (taxonomy pass; rationale and measurements in docs/TAXONOMY.md).
#
# Derived from 27,056 English conversation openers: TF-IDF + k-means clusters, 200 uniformly random openers read
# end to end, and 250 hand-labelled openers (150 held-out calibration rows in docs/taxonomy_calibration.jsonl +
# 100 dev rows used to tune the keywords). Ids are stable snake_case strings used everywhere in code and data.
#
# Field semantics
#   default_decision     what the escalation policy expects when nothing else fires (rules/LLM can override).
#   default_reason_code  primary reason code when default_decision is escalate (CONTRACT §5).
#   examples             three verbatim customer openers (cleaned text) from the corpus.
#   keywords             used ONLY by the simple_keyword baseline and by stratified sampling (never by the LLM).
#                        Classifier: the intent with the most keyword hits wins; keywords shorter than five
#                        characters match on word boundaries, longer ones as substrings; ties -> the earlier intent
#                        in this file; no hit -> other. The order of intents is therefore deliberate: rare and
#                        escalation-critical intents come first so that ties resolve towards the safer label, and
#                        `other` is last so it only wins when it is the sole match. Apostrophe keywords appear in
#                        both straight (') and curly (’) form because tweets use both. A few deliberately
#                        overlapping keywords (e.g. "download" + "downloads") act as weights for decisive phrases.
#   Descriptions are kept under 200 characters and the first example under 80 because cadence.agent.prompts embeds
#   them verbatim in the system prompt; the full boundary rules live in docs/TAXONOMY.md §3.
