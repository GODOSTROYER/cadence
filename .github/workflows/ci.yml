name: Offline verification
on: [push, pull_request]
jobs:
  python:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      CADENCE_CACHE_ONLY: "1"
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e ".[dev]"
      - run: python -m ruff check src scripts tests api analysis_tools
      - run: python -m pytest -p no:cacheprovider
      - run: python -m cadence.cli reproduce
      - run: python analysis_tools/reproduce_benchmark.py
      - run: python analysis_tools/reproduce_routing_comparison.py
      - run: python analysis_tools/reproduce_quality.py
      - run: python analysis_tools/reproduce_balanced.py --experiment results/balanced_dev --experiment results/balanced_dev_v2 --experiment results/balanced_dev_v3 --experiment results/balanced_confirmation
      - run: python analysis_tools/publish_balanced.py --check
      - run: python analysis_tools/publish_quality.py --check
      - run: python scripts/verify_knowledge.py --as-of 2026-09-18
      - run: python scripts/verify_knowledge.py --registry config/knowledge/v3.json --as-of 2026-09-18
      - run: python analysis_tools/compare_verified_development.py verify
      - run: python analysis_tools/reproduce_verified.py --experiment results/verified_dev_v4
      - run: python analysis_tools/reproduce_verified.py --experiment results/verified_calibration_v1
      - run: python analysis_tools/reproduce_verified.py --experiment results/verified_postpilot_regression_v1
      - run: python analysis_tools/compare_verified_variants.py --check
      - run: python analysis_tools/summarize_verified_retrieval.py --check
      - run: python analysis_tools/summarize_verified_controls.py --experiment results/verified_ablation_v1 --check
      - run: python analysis_tools/verify_submission.py
      - run: python analysis_tools/post_audit_regression.py
      - run: python scripts/15_publish_benchmark.py --check
      - run: python scripts/17_prepare_review_study.py --check
      - run: python scripts/14_review_study.py --ratings results/review_study/astra_ratings.jsonl --out results/reproduced/astra_summary.json
      - run: python scripts/14_review_study.py --ratings results/review_study/arnav_verified_ratings.jsonl --confirmation results/review_study/HUMAN_VERIFICATION.json --out results/reproduced/arnav_verified_summary.json
      - run: git diff --exit-code -- results/predictions.jsonl results/judge_scores.jsonl results/ui
  ui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - run: npm ci
        working-directory: ui
      - run: npm run build
        working-directory: ui
