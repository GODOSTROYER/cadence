[project]
name = "cadence"
version = "0.1.0"
description = "Cadence — an evaluated AI support agent for @SpotifyCares (Hiver SDE Intern take-home)"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Arnav Bule", email = "arnav.bule05@gmail.com" }]
dependencies = [
  "pandas>=2.2",
  "pyarrow>=15",
  "numpy>=1.26",
  "scikit-learn>=1.5",
  "scipy>=1.12",
  "rank-bm25>=0.2.2",
  "rapidfuzz>=3.9",
  "google-genai>=1.30",
  "pydantic>=2.7",
  "python-dotenv>=1.0",
  "pyyaml>=6",
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "rich>=13",
  "typer>=0.12",
  "matplotlib>=3.8",
  "requests>=2.31",
  "orjson>=3.10",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.5"]

[project.scripts]
cadence = "cadence.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cadence"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"

[tool.ruff]
line-length = 110
target-version = "py312"
src = ["src", "scripts", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]
